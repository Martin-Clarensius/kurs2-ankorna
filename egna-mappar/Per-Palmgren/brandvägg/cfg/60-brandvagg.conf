# ANVÄNDS INTE. Borttagen från /etc/rsyslog.d/ på elev-33 (history rad 411).
# Skickade kärnloggen okrypterat på tcp 514, och brandväggen har ingen regel för 514.
# All loggning går nu över TLS med 90-tls-forward.conf. Se v7/hardningsrapport.md, R2.
kern.* action(type="omfwd" target="172.20.1.58" port="514" protocol="tcp"
queue.type="LinkedList" queue.filename="fwd_kern"
queue.saveOnShutdown="on" action.resumeRetryCount="-1")
