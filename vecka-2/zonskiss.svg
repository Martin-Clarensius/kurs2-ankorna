<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Team Ankorna zonindelning med planerade trafikflöden">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#285b85"/></marker></defs>
<style>
text{font-family:Arial,sans-serif;fill:#1b2d42}.title{font-size:28px;font-weight:bold}.name{font-size:19px;font-weight:bold}.sub{font-size:15px}.note{font-size:14px}.zone{fill:#edf4ff;stroke:#35668c;stroke-width:2}.side{fill:#eaf8f0;stroke:#2c8360;stroke-width:2}.pending{fill:#fff4e5;stroke:#b27b2c;stroke-width:2}.flow{stroke:#285b85;stroke-width:3;fill:none;marker-end:url(#arrow)}.observed{stroke-dasharray:8 6}.footer{fill:#f5f7fa;stroke:#cbd5e1}
</style>
<text x="600" y="42" class="title" text-anchor="middle">Team Ankorna – Workshop 2: Zonskiss</text>
<text x="600" y="68" class="note" text-anchor="middle">Planerade 10.40.0.0/16-zoner • heldragna pilar = föreslagna flöden • streckad = observerad SSH i vecka 1</text>
<rect class="zone" x="415" y="90" width="370" height="66" rx="12"/><text x="600" y="128" class="name" text-anchor="middle">Internet / externa klienter</text>
<rect class="zone" x="415" y="207" width="370" height="78" rx="12"/><text x="600" y="240" class="name" text-anchor="middle">Webb / DMZ</text><text x="600" y="263" class="sub" text-anchor="middle">10.40.0.0/27 • sladd (förslag)</text>
<rect class="zone" x="415" y="338" width="370" height="78" rx="12"/><text x="600" y="371" class="name" text-anchor="middle">Applikation</text><text x="600" y="394" class="sub" text-anchor="middle">10.40.0.32/27 • planerad</text>
<rect class="zone" x="415" y="469" width="370" height="78" rx="12"/><text x="600" y="502" class="name" text-anchor="middle">Databas</text><text x="600" y="525" class="sub" text-anchor="middle">10.40.0.64/28 • planerad</text>
<path class="flow" d="M600 156 V207"/><text x="615" y="187" class="note">HTTPS 443 (förslag)</text>
<path class="flow" d="M600 285 V338"/><text x="615" y="315" class="note">App-port TBD</text>
<path class="flow" d="M600 416 V469"/><text x="615" y="447" class="note">DB-port TBD</text>
<rect class="side" x="35" y="338" width="310" height="78" rx="12"/><text x="190" y="371" class="name" text-anchor="middle">Logg / övervakning</text><text x="190" y="394" class="sub" text-anchor="middle">10.40.0.80/28 • planerad</text>
<path class="flow" d="M415 378 H345"/><text x="375" y="358" class="note" text-anchor="middle">Logg TBD</text>
<rect class="side" x="855" y="338" width="310" height="78" rx="12"/><text x="1010" y="371" class="name" text-anchor="middle">Management / jump</text><text x="1010" y="394" class="sub" text-anchor="middle">10.40.0.96/28 • jump (förslag)</text>
<rect class="pending" x="855" y="555" width="310" height="85" rx="12"/><text x="1010" y="587" class="name" text-anchor="middle">Labb-/övningsservrar</text><text x="1010" y="612" class="sub" text-anchor="middle">Subnät TBD • elev-29</text>
<path class="flow observed" d="M1010 416 V555"/><text x="1025" y="492" class="note">SSH TCP 22</text>
<rect class="pending" x="35" y="555" width="310" height="85" rx="12"/><text x="190" y="587" class="name" text-anchor="middle">Externa beroenden</text><text x="190" y="612" class="sub" text-anchor="middle">DNS, NTP, status • ägarskap TBD</text>
<rect class="footer" x="35" y="684" width="1130" height="128" rx="12"/><text x="60" y="714" class="name">Principer och förbehåll</text><text x="60" y="740" class="note">• Webb/DMZ får inte nå databasen direkt. All annan trafik nekas som standard om den inte uttryckligen godkänts.</text><text x="60" y="765" class="note">• Observerade 172.20.1.x-adresser från vecka 1 är inte samma sak som planerade 10.40.x.x-adresser.</text><text x="60" y="790" class="note">• Skissen är ett arbetsförslag: verifiera labbzon, tillgångar, portar och ägarskap med gruppen.</text>
</svg>
